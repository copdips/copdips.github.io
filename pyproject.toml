[project]
name = "copdips-github-io"
version = "0.1.0"
description = "My blog: https://copdips.com/"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "csv2md>=1.6.0",
    "markdown>=3.7",
    "pyyaml>=6.0.2",
    "zensical>=0.1.0",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "mypy>=2.0.0",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools"]
