name: Build and Deploy
run-name: "🚀[${{ github.workflow }}] - ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: copdips.com

    steps:
      - name: Checkout repository
        # Sparse checkout keeps the build fast; root-level files (zensical.toml,
        # pyproject.toml, uv.lock, Makefile) are always included in cone mode.
        # https://squidfunk.github.io/mkdocs-material/blog/2023/09/22/using-git-sparse-checkout-for-faster-documentation-builds/
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            docs
            tools

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install os dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python dependencies
        run: make ci-install

      - name: Remove future-dated markdown files
        run: |
          current_date=$(date +%Y-%m-%d)
          echo "Current date: $current_date"
          find ./docs/posts -type f -name "*.md" | while read file; do
            filename=$(basename "$file")
            filedate=$(echo "$filename" | grep -oP '^\d{4}-\d{2}-\d{2}')

            if [ -n "$filedate" ] && [ "$(date -d "$filedate" +%s)" -gt "$(date -d "$current_date" +%s)" ]; then
              echo "Deleting future-dated file: $file (date: $filedate > $current_date)"
              rm "$file"
            fi
          done

      - name: Build documentation
        run: |
          uv run zensical --version
          uv run zensical build -s
          cp ads.txt ./site/

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
