version: 2

updates:
  - package-ecosystem: uv
    # Security updates only (limit 0 disables version updates) to keep maximum
    # compatibility - see https://t.ly/INSR_. Use the uv ecosystem, not pip: it
    # updates pyproject.toml and uv.lock together, so `uv sync --frozen` in CI
    # stays consistent.
    open-pull-requests-limit: 0
    directory: "/"
    labels: []
    schedule:
      interval: weekly
      time: "04:00"
  - package-ecosystem: github-actions
    # One grouped PR per week: with "Require branches to be up to date before
    # merging" enabled, separate PRs go stale as soon as the first one merges.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    directory: "/"
    labels: []
    schedule:
      interval: weekly
      time: "04:00"
